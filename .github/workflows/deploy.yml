name: Build and Deploy Angular App

on:
  push:
    branches:
      - main  # Triggers the workflow on every push to the main branch

permissions:
  contents: write  # Gives the action permission to push to the gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Fetch the source code from the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Match this to your local Node version

      # 3. Install project dependencies cleanly
      - name: Install Dependencies
        run: npm ci

      # 4. Run application tests (Optional, uncomment if you have unit tests)
      # - name: Run Tests
      #   run: npm run test -- --watch=false --browsers=ChromeHeadless

      # 5. Build the Angular production application
      - name: Build Angular Application
        run: npm run build -- --configuration=production --base-href=/YOUR_REPOSITORY_NAME/

      # 6. Deploy the built files to the gh-pages branch
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/YOUR_REPOSITORY_NAME/browser  # For Angular 17+, build output is inside a /browser subfolder
